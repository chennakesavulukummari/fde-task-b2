version: 0.2

env:
  shell: bash
  variables:
    APP_NAME: "fde-task-app"
    ARTIFACT_BUCKET: "fde-artifacts"
    AWS_REGION: "ap-south-2"

phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - aws --version
      - python3 --version
  build:
    commands:
      - echo "== Provisioning 3 EC2 Instances (1 Control Plane + 2 Workers) & Installing Kubernetes =="
      - bash scripts/provision-k8s.sh

