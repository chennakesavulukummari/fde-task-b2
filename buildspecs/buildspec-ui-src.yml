version: 0.2

env:
  shell: bash
  variables:
    APP_NAME: "fde-task-app"
    ARTIFACT_BUCKET: "s3://fde-artifacts"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - node --version
      - aws --version

  pre_build:
    commands:
      - echo "== Validating UI Code =="
      - node --check ui/app.js
      - grep -q '<script src="/app.js"' ui/index.html
      - grep -q '__API_HOST__' ui/nginx.conf.tpl
      - bash -n deploy/common.sh deploy/ui.sh

  build:
    commands:
      - echo "== Packaging UI Artifact =="
      - COMMIT_HASH=$(echo "${CODEBUILD_RESOLVED_SOURCE_VERSION:-local}" | cut -c 1-7)
      - RELEASE_VERSION="$(date -u +%Y%m%d-%H%M%S)-${COMMIT_HASH}"
      - mkdir -p dist
      - tar -czf dist/ui.tar.gz ui deploy/common.sh deploy/ui.sh
      - ( cd dist && sha256sum ui.tar.gz > SHA256SUMS )
      - |
        cat > dist/manifest.json <<EOF
        {"component":"ui","version":"${RELEASE_VERSION}","commit":"${COMMIT_HASH}","built_at":"$(date -u +%FT%TZ)"}
        EOF

  post_build:
    commands:
      - echo "== Pushing to S3 =="
      - |
        if [ -n "${ARTIFACT_BUCKET}" ]; then
          aws s3 cp dist/ "s3://${ARTIFACT_BUCKET}/${RELEASE_VERSION}/" --recursive
          echo "${RELEASE_VERSION}" | aws s3 cp - "s3://${ARTIFACT_BUCKET}/ui-LATEST"
        fi

artifacts:
  files:
    - '**/*'
  base-directory: 'dist'
  name: ui-artifact
