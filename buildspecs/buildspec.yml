version: 0.2

env:
  shell: bash
  variables:
    APP_NAME: "fde-task-app"
    ARTIFACT_BUCKET: "fde-artifacts"
    AWS_REGION: "ap-south-2"
    RELEASE: "latest"

phases:
  install:
    runtime-versions:
      nodejs: 20
      python: 3.12
    commands:
      - docker --version
      - aws --version
      - node --version
      - python3 --version
  pre_build:
    commands:
      - echo "== Step 1 - Building UI, API, and DB Container Images & Pushing to S3 =="
      - bash scripts/build-k8s-images.sh
  build:
    commands:
      - echo "== Step 2 - Provisioning 3 EC2 Instances (1 Control Plane + 2 Workers) & Installing Kubernetes =="
      - bash scripts/provision-k8s.sh
      - echo "== Step 3 - Creating 3 Namespaces (db, api, ui) & Deploying 3 Containers to Kubernetes =="
      - bash scripts/deploy-k8s.sh

